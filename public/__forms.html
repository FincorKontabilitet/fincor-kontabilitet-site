<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <title>Regjistrimi i formularit të konsultës</title>
  </head>
  <body>
    <form
      name="kerkese-konsulence"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="kerkese-konsulence" />
      <input name="subject" />
      <input name="name" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="service" />
      <input name="package" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
